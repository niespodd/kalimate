name: release

# Build native packages for macOS, Windows and Linux and attach them to a
# GitHub release. Fyne and malgo both use cgo, so each target is built on its
# own native runner rather than cross-compiled.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run: builds and uploads artifacts, no release

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Apple Silicon runner builds a universal (arm64 + x86_64) binary,
          # so there's no dependency on the scarce/retiring Intel macOS runners.
          - os: macos-14
            target: darwin
            asset: Kalimate-macos-universal.zip
          - os: windows-latest
            target: windows
            asset: Kalimate-windows-amd64.zip
          - os: ubuntu-latest
            target: linux
            asset: Kalimate-linux-amd64.tar.xz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libasound2-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev

      - name: Install fyne CLI
        run: |
          go install fyne.io/fyne/v2/cmd/fyne@v2.8.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package
        env:
          CGO_ENABLED: "1"
        run: |
          # No --os: that flag is for mobile targets. For desktop, `fyne package`
          # builds for the host OS, which is what each native runner provides.
          args=(package --icon assets/icon.png)
          if [[ "${{ matrix.target }}" == "darwin" ]]; then
            # Build both macOS arches on this Apple Silicon runner and lipo them
            # into one universal binary, then let fyne wrap it into the .app.
            GOARCH=arm64 go build -o kalimate-arm64 .
            GOARCH=amd64 go build -o kalimate-amd64 .
            lipo -create -output kalimate kalimate-arm64 kalimate-amd64
            args+=(--executable kalimate)
          fi
          # On a tag, stamp the version from it (strip the leading "v");
          # otherwise fyne reads the version from FyneApp.toml.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            args+=(--appVersion "${GITHUB_REF#refs/tags/v}")
          fi
          fyne "${args[@]}"

      - name: Archive
        run: |
          case "${{ matrix.target }}" in
            darwin)  ditto -c -k --keepParent Kalimate.app "${{ matrix.asset }}" ;;
            windows) 7z a "${{ matrix.asset }}" Kalimate.exe ;;
            linux)   mv Kalimate.tar.xz "${{ matrix.asset }}" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
