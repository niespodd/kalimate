<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- panel -->
  <rect x="20" y="20" width="600" height="260" rx="22" fill="#F4E8D2" stroke="#E2D2B4" stroke-width="2"/>

  <!-- bridge -->
  <rect x="88" y="94" width="464" height="14" rx="7" fill="#7A5230"/>

  <!-- tines: neutral, with the centre one plucked -->
  <g fill="#5B6470">
    <rect x="102" y="106" width="16" height="84"  rx="8"/>
    <rect x="172" y="106" width="16" height="104" rx="8"/>
    <rect x="242" y="106" width="16" height="124" rx="8"/>
    <rect x="312" y="106" width="16" height="160" rx="8" fill="#E08A1E"/>
    <rect x="382" y="106" width="16" height="124" rx="8"/>
    <rect x="452" y="106" width="16" height="104" rx="8"/>
    <rect x="522" y="106" width="16" height="84"  rx="8"/>
  </g>

  <!-- vibration on the plucked tine -->
  <g stroke="#E08A1E" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M305 148 q-9 10 0 20"/>
    <path d="M335 148 q9 10 0 20"/>
  </g>

  <!-- pluck label + arrow -->
  <text x="320" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#C56A0C" letter-spacing="1">PLUCK</text>
  <path d="M320 62 L320 88 M320 88 L313 80 M320 88 L327 80" stroke="#C56A0C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- left finger: lies across the two tines left of centre, tip pointing right -->
  <g transform="rotate(-5 270 160)">
    <rect x="30" y="138" width="248" height="44" rx="22" fill="#E7B592" stroke="#C8926B" stroke-width="2"/>
    <path d="M150 140 q6 20 0 40" stroke="#C8926B" stroke-width="1.5" fill="none" opacity="0.6"/>
    <ellipse cx="262" cy="160" rx="10" ry="15" fill="#F6E0CE" stroke="#D6A982" stroke-width="1.5"/>
  </g>

  <!-- right finger: mirrors the left, tip pointing left -->
  <g transform="rotate(5 370 160)">
    <rect x="362" y="138" width="248" height="44" rx="22" fill="#E7B592" stroke="#C8926B" stroke-width="2"/>
    <path d="M490 140 q6 20 0 40" stroke="#C8926B" stroke-width="1.5" fill="none" opacity="0.6"/>
    <ellipse cx="378" cy="160" rx="10" ry="15" fill="#F6E0CE" stroke="#D6A982" stroke-width="1.5"/>
  </g>

  <!-- labels: one finger mutes the two tines it rests on -->
  <text x="150" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#3A3F48" letter-spacing="1">MUTE</text>
  <text x="490" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#3A3F48" letter-spacing="1">MUTE</text>
</svg>
